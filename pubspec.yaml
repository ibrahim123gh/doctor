
name: doctor
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # State management
  flutter_bloc: ^8.1.3

  # Dependency injection
  get_it: ^7.6.4

  # JSON & Freezed annotations
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Networking
  dio: ^5.3.3
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1

  # Localization
  easy_localization: ^3.0.8

  # UI
  flutter_svg: ^2.3.0
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.7

  # Other
  init: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.5.4
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  retrofit_generator: ^9.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/
